[project]
name = "dj-coach-prototypes"
version = "0.1.0"
description = "DJ set recording and analysis"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "mido>=1.3.0",
    "python-rtmidi>=0.4.9",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false