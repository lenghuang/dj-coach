[project]
name = "dj-coach-prototypes"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2.1.0",
    "librosa>=0.11.0",
    "numba==0.60.0",     # Downgrade from 0.64.0
    "llvmlite==0.43.0",  # Downgrade to match Numba 0.60
    "sounddevice>=0.4.6",
    "mido>=1.3.0",
    "python-rtmidi>=0.4.9",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false